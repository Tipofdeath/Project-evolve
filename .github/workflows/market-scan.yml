name: EVOLVE Shared Paper Research

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify shared auto/forward engine integration
        run: python -m unittest -v test_evolve_shared.py

      - name: Run backtester regression tests
        run: python -m unittest -v test_evolve_backtest_v27.py test_evolve_backtest_v28.py test_evolve_market_scan_v23.py test_evolve_research_v29.py test_evolve_experiments_v30.py test_evolve_risk_v31.py test_evolve_history_v32.py test_evolve_validation_v33.py test_evolve_audit_v34.py test_evolve_verify_v35.py test_evolve_execution_v36.py test_evolve_conservative_v37.py test_evolve_smc_v38.py test_evolve_smc_context_v39.py test_evolve_compare_v40.py test_evolve_diagnostics_v41.py test_evolve_breakout_v42.py test_evolve_validation_v43.py

      - name: Scan crypto, forex and gold
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python evolve_market_scan_v23.py
      
      - name: Analyze market strategies
        run: python evolve_strategy_v2.py
      - name: Backtest market strategies
        run: python evolve_backtest_v28.py

      - name: Analyze research diagnostics
        run: python evolve_research_v29.py

      - name: Run EVOLVE 3.0 research experiments
        run: python evolve_experiments_v30.py

      - name: Run EVOLVE 3.1 risk validation
        run: python evolve_risk_v31.py

      - name: Run EVOLVE 3.2 extended-history research
        run: python evolve_history_v32.py

      - name: Run EVOLVE 3.3 daily validation
        run: python evolve_validation_v33.py

      - name: Run EVOLVE 3.4 audit diagnostics
        run: python evolve_audit_v34.py

      - name: Run EVOLVE 3.5 independent verification
        run: python evolve_verify_v35.py

      - name: Run EVOLVE 3.6 OHLC execution stress
        run: python evolve_execution_v36.py

      - name: Run EVOLVE 3.7 conservative execution
        run: python evolve_conservative_v37.py

      - name: Run EVOLVE 3.8 SMC feature research
        run: python evolve_smc_v38.py

      - name: Run EVOLVE 3.9 advanced SMC context
        run: python evolve_smc_context_v39.py

      - name: Run EVOLVE 4.0 SMC strategy comparison
        run: python evolve_compare_v40.py

      - name: Run EVOLVE 4.1 strategy diagnostics
        run: python evolve_diagnostics_v41.py

      - name: Run EVOLVE 4.2 breakout strategy comparison
        run: python evolve_breakout_v42.py

      - name: Run EVOLVE 4.3 chronological validation
        run: python evolve_validation_v43.py

      - name: Run EVOLVE 4.4 crypto reliability audit
        run: python evolve_crypto_reliability_v44.py

      - name: Restore EVOLVE 4.5 prospective signal history
        uses: actions/cache/restore@v4
        with:
          path: forward_state_v45.json
          key: evolve-v45-${{ github.run_id }}
          restore-keys: |
            evolve-v45-

      - name: Record EVOLVE 4.5 crypto forward signals
        run: python evolve_forward_v45.py

      - name: Save EVOLVE 4.5 prospective signal history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: forward_state_v45.json
          key: evolve-v45-${{ github.run_id }}

      - name: Restore EVOLVE 4.6 paper state
        uses: actions/cache/restore@v4
        with:
          path: paper_state_v46.json
          key: evolve-v46-${{ github.run_id }}
          restore-keys: |
            evolve-v46-

      - name: Update EVOLVE 4.6 paper positions
        run: python evolve_paper_v46.py

      - name: Generate shared six-bot daily auto dashboard
        run: python evolve_auto_dashboard_v47.py

      - name: Save EVOLVE 4.6 paper state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: paper_state_v46.json
          key: evolve-v46-${{ github.run_id }}

      - name: Upload EVOLVE 4.6 paper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-paper-v46
          path: |
            paper_report_v46.json
            paper_state_v46.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload EVOLVE shared auto dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-auto-daily-v47
          path: |
            auto_dashboard_v47.html
            auto_dashboard_v47.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload EVOLVE 4.5 forward report and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-forward-v45
          path: |
            forward_report_v45.json
            forward_state_v45.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload EVOLVE 4.4 crypto reliability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-crypto-reliability-v44
          path: crypto_reliability_v44.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 4.3 validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-validation-v43
          path: validation_v43.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 4.2 breakout comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-breakout-comparison-v42
          path: breakout_comparison_v42.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 4.1 strategy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-smc-diagnostics-v41
          path: smc_diagnostics_v41.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 4.0 strategy comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-smc-comparison-v40
          path: smc_comparison_v40.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.9 advanced SMC context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-smc-context-v39
          path: smc_context_v39.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.8 SMC feature research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-smc-features-v38
          path: smc_features_v38.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.7 conservative execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-conservative-execution-v37
          path: conservative_execution_v37.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.6 execution stress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-execution-stress-v36
          path: execution_stress_v36.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.5 verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-independent-verification-v35
          path: independent_verification_v35.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.4 audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-validation-audit-v34
          path: validation_audit_v34.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.3 daily validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-market-validation-v33
          path: market_validation_v33.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.2 extended-history research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-extended-history-v32
          path: extended_history_v32.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.1 risk validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-risk-validation-v31
          path: risk_validation_v31.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload EVOLVE 3.0 research experiments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-research-experiments-v30
          path: research_experiments_v30.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-research-diagnostics
          path: research_diagnostics_v29.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-backtest-report
          path: backtest_report_v28.json
          if-no-files-found: warn
          retention-days: 7
          
      - name: Upload strategy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-strategy-report
          path: strategy_report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Forex and gold data quality
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-forex-gold-quality
          path: market_data_quality.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-market-snapshot
          path: market_snapshot.json
          if-no-files-found: warn
          retention-days: 7
          

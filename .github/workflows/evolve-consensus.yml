name: EVOLVE Shared Signal Consensus and Paper Execution

on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: evolve-consensus-v52
  cancel-in-progress: false

jobs:
  consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve last successful independent paper reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_report() {
            local workflow="$1" artifact="$2" report="$3"
            local id
            id="$(gh run list --workflow "$workflow" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$id" ]; then
              echo "No successful run for $workflow" >&2
              return 1
            fi
            mkdir -p "tmp/$artifact"
            gh run download "$id" -n "$artifact" -D "tmp/$artifact"
            test -s "tmp/$artifact/$report"
            cp "tmp/$artifact/$report" "$report"
          }
          fetch_report market-scan.yml evolve-forward-v45 forward_report_v45.json
          fetch_report evolve-hourly.yml evolve-hourly-v48 hourly_report_v48.json
          fetch_report evolve-mtf.yml evolve-mtf-v49 mtf_report_v49.json
      - name: Analyze complete market structure (research only)
        continue-on-error: true
        run: python evolve_market_structure_v53.py
      - name: Evaluate cross-engine signal consensus (no orders)
        if: success()
        run: python evolve_consensus_v50.py
      - name: Restore last successful consensus paper portfolio
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --workflow evolve-consensus.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$previous" ] && gh api "repos/$GH_REPO/actions/runs/$previous/artifacts" --jq '.artifacts[].name' | grep -qx evolve-consensus-paper-v52; then
            mkdir -p tmp/previous-paper
            gh run download "$previous" -n evolve-consensus-paper-v52 -D tmp/previous-paper
            test -s tmp/previous-paper/consensus_paper_state_v52.json
            cp tmp/previous-paper/consensus_paper_state_v52.json .
          else
            echo "No previous v5.2 state artifact: initialize prospective state only"
          fi
      - name: Update prospective consensus paper portfolio
        run: python evolve_consensus_paper_v52.py
      - name: Upload consensus paper portfolio and report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-consensus-paper-v52
          path: |
            consensus_paper_state_v52.json
            consensus_paper_report_v52.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload market structure research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-market-structure-v53
          path: market_structure_report_v53.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload shared consensus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-consensus-v50
          path: consensus_report_v50.json
          if-no-files-found: warn
          retention-days: 30

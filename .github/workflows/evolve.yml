name: Project EVOLVE Auto Trading

on:
  workflow_dispatch:
  schedule:
  - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: evolve-paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        run: |
          if [ -f state/evolve.sqlite3 ]; then
            cp state/evolve.sqlite3 evolve.sqlite3
          fi

      - name: Run one paper trading evaluation
        env:
          EVOLVE_DB: evolve.sqlite3
        run: |
          python -c "import main; main.DB.seed(); main.run_once(); main.DB.conn.close()"

      - name: Save bot progress
        run: |
          mkdir -p state
          cp evolve.sqlite3 state/evolve.sqlite3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/evolve.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "Save EVOLVE paper trading state"
            git push
          fi
          

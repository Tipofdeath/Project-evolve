name: Project EVOLVE Auto Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'

permissions:
  contents: read

concurrency:
  group: evolve-daily-paper-state
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify shared engine
        run: python -m unittest -v test_evolve_shared.py

      - name: Restore prospective daily signals
        uses: actions/cache/restore@v4
        with:
          path: forward_state_v45.json
          key: evolve-v45-${{ github.run_id }}
          restore-keys: |
            evolve-v45-

      - name: Restore daily paper portfolios
        uses: actions/cache/restore@v4
        with:
          path: paper_state_v46.json
          key: evolve-v46-${{ github.run_id }}
          restore-keys: |
            evolve-v46-

      - name: Run completed 1D candle paper evaluation and dashboard
        run: python main.py

      - name: Save prospective daily signals
        if: success()
        uses: actions/cache/save@v4
        with:
          path: forward_state_v45.json
          key: evolve-v45-${{ github.run_id }}

      - name: Save daily paper portfolios
        if: success()
        uses: actions/cache/save@v4
        with:
          path: paper_state_v46.json
          key: evolve-v46-${{ github.run_id }}

      - name: Upload six-bot daily dashboard and audit state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-auto-daily-v47
          path: |
            auto_dashboard_v47.html
            auto_dashboard_v47.json
            paper_report_v46.json
            paper_state_v46.json
            forward_report_v45.json
            forward_state_v45.json
          if-no-files-found: warn
          retention-days: 30
